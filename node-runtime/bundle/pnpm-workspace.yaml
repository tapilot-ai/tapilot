packages:
  - .
minimumReleaseAgeExclude:
  - '@midscene/core@1.15.2'
  - '@midscene/shared@1.15.2'
  - '@midscene/test@1.15.2'
  - qs@6.17.0
patchedDependencies:
  'http-server@14.1.1': patches/http-server-native-compare.patch
  '@midscene/core@1.15.2': patches/midscene-core-runtime.patch
  '@midscene/test@1.15.2': patches/midscene-test-unbounded.patch
supportedArchitectures:
  cpu:
    - current
    - arm64
    - wasm32
  os:
    - current
    - android

# Security fixes until upstream dependency ranges include these releases.
overrides:
  'http-server@14.1.1>secure-compare': '-'
  sharp: 0.35.5
  js-yaml: 4.3.2
  uuid: 11.1.1
  'glob@>=11.0.0 <11.1.0': 11.1.0
  'undici@>=6 <7': 6.29.1
  'undici@>=8 <9': 8.12.3
  zod: 4.6.7
  ip-address: 10.7.5
  qs: 6.17.0

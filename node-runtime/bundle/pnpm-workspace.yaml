packages:
  - .
minimumReleaseAgeExclude:
  - '@midscene/core@1.17.6'
  - '@midscene/shared@1.17.6'
  - '@midscene/test@1.17.6'
  - qs@6.17.0
patchedDependencies:
  'http-proxy-agent@9.1.0': patches/http-proxy-agent-android-auth.patch
  'https-proxy-agent@9.1.0': patches/https-proxy-agent-android-auth.patch
  'http-server@14.1.1': patches/http-server-native-compare.patch
  '@midscene/core@1.17.6': patches/midscene-core-runtime.patch
  '@midscene/test@1.17.6': patches/midscene-test-unbounded.patch
supportedArchitectures:
  cpu:
    - current
    - arm64
    - wasm32
  os:
    - current
    - android

# Security fixes until upstream dependency ranges include these releases.
overrides:
  'http-proxy-agent@9.1.0>proxy-agent-negotiate': '-'
  'https-proxy-agent@9.1.0>proxy-agent-negotiate': '-'
  'http-server@14.1.1>secure-compare': '-'
  sharp: 0.35.5
  js-yaml: 4.3.2
  uuid: 11.1.1
  'glob@>=9 <14.0.2': 14.0.2
  minimatch: 11.0.1
  follow-redirects: 1.16.2
  'undici@>=6 <7': 6.29.1
  'undici@>=8 <9': 8.12.3
  zod: 4.6.7
  ip-address: 10.7.5
  qs: 6.17.0
# Only the bundler needs installation code; these SDKs ship built JavaScript.
allowBuilds:
  esbuild@0.25.11: true
  esbuild@0.28.2: true
  '@google/genai@2.21.0': false
  protobufjs@7.6.6: false

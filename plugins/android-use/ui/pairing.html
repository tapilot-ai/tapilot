<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配对 Android Use</title><link rel="stylesheet" href="pairing.css"></head><body><main><header><span class="badge">ANDROID USE</span><h1>用手机扫一扫，连接电脑</h1><p>保持手机和电脑连接同一 Wi-Fi，在 Tapilot 无线控制中选择「扫描电脑二维码」。</p></header><section class="qr"><img src="qr.svg" alt="使用手机 Tapilot 扫描的电脑配对二维码"><span id="expiry"></span></section><p id="status" role="status">等待手机扫码…</p><button id="confirm" hidden>确认配对此手机</button><p id="error" role="alert" hidden></p><section class="nearby"><div class="row"><h2>附近的 Tapilot</h2><button id="discover">刷新</button></div><ul id="devices"><li>正在查找同一网络中的手机…</li></ul><p class="hint">发现设备不会授予控制权限；首次连接仍需手机扫码，并在此确认。二维码 5 分钟内有效，配对信息加密传输。</p></section></main><script type="module" src="pairing.mjs"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android Use</title><style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;background:light-dark(#f7f7f8,#171719);color:light-dark(#252528,#f4f4f5)}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}header,footer{display:flex;gap:12px;align-items:center;justify-content:space-between}strong{font-size:16px}time{font-size:12px;color:light-dark(#62626b,#b8b8c1)}main{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;background:#08080a;border-radius:24px;overflow:hidden}img{height:100%;width:100%;object-fit:contain}[role=status]{text-align:center;font-size:14px;margin:0;min-height:42px}button{font:inherit;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid light-dark(#d0d0d5,#555560);color:inherit;background:light-dark(#fff,#28282e);cursor:pointer}button:focus-visible{outline:3px solid #8876ed;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}#resume{background:#6750a4;color:#fff;border-color:#6750a4}footer{justify-content:center;flex-wrap:wrap}[hidden]{display:none!important}

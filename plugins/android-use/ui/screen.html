<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android Use</title><style>
:root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;background:light-dark(#f7f7f8,#171719);color:light-dark(#252528,#f4f4f5)}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}header,footer{display:flex;gap:12px;align-items:center;justify-content:space-between}strong{font-size:16px}time{font-size:12px;color:light-dark(#62626b,#b8b8c1)}main{min-height:160px;flex:1;display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden}img{touch-action:none;user-select:none;cursor:crosshair;display:block;flex:none;height:auto;width:auto;max-height:100%;max-width:100%;object-fit:contain;border-radius:18px;box-shadow:0 0 0 1px #7775,0 8px 24px #0002}[role=status]{text-align:center;font-size:14px;margin:0;min-height:36px}button{font:inherit;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid light-dark(#d0d0d5,#555560);color:inherit;background:light-dark(#fff,#28282e);cursor:pointer}button:active:not(:disabled){filter:brightness(.88)}button:focus-visible{outline:3px solid #8876ed;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}#resume{background:#6750a4;color:#fff;border-color:#6750a4}footer{justify-content:center;flex-wrap:wrap}.navigation{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}form{display:flex;gap:8px;flex-wrap:wrap}form label{font-size:13px}textarea{width:100%;min-height:48px;max-height:96px;resize:vertical;font:inherit;color:inherit;background:light-dark(#fff,#28282e);border:1px solid #888;border-radius:8px;padding:8px}form button{margin-left:auto}[role=alert]{font-size:13px;margin:0}body{min-height:560px}[hidden]{display:none!important}
</style></head><body><header><strong>Android Use</strong><time></time></header><main><img draggable="false" hidden alt="当前 Android 手机屏幕"></main><p role="status" aria-live="polite">正在连接手机画面…</p><p role="alert" hidden></p><nav class="navigation" aria-label="手机操作"><button data-control data-action="back">返回</button><button data-control data-action="home">主页</button><button data-control data-action="recentApps">多任务</button><button data-control data-action="up" aria-label="查看上方内容">向上翻</button><button data-control data-action="down" aria-label="查看下方内容">向下翻</button></nav><form><label for="phone-text">先点击手机输入框，再输入文字</label><textarea id="phone-text" maxlength="10000" rows="1" placeholder="输入到手机，不会自动发送"></textarea><label><input id="replace" type="checkbox" checked>替换原文字</label><button data-control type="submit">输入文字</button><button data-control data-action="enter" type="button">回车</button></form><footer><button id="pause">暂停画面</button><button id="disconnect">断开并释放手机</button><button id="resume" hidden>已完成继续</button></footer><script type="module">/*BUNDLE*/</script></body></html>

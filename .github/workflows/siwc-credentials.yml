name: Prepare SIWC shard access
on:
  workflow_call:
    outputs:
      ticket:
        description: Encrypted access-only lease bound to this run and attempt
        value: ${{ jobs.prepare.outputs.ticket }}
    secrets:
      # Declared for workflow schema tooling; the caller MUST NOT pass it.
      # The prepare job resolves the value from its owner environment instead.
      SIWC_CREDENTIALS:
        required: false
      SIWC_SECRET_WRITE_TOKEN:
        required: true
      SIWC_TRANSPORT_KEY:
        required: true
permissions:
  contents: read
jobs:
  prepare:
    # Environment secrets are read at JOB START, after this exclusive slot is
    # available. Repository secrets would retain the stale workflow-queue snapshot.
    environment: tapilot-siwc
    concurrency:
      group: tapilot-siwc-refresh-owner
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ticket: ${{ steps.access.outputs.ticket }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json
      - run: npm ci --prefix tests/midscene
      - name: Refresh if needed, persist, then issue access-only lease
        id: access
        env:
          TAPILOT_SIWC_ENVIRONMENT: tapilot-siwc
          SIWC_CREDENTIALS: ${{ secrets.SIWC_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.SIWC_SECRET_WRITE_TOKEN }}
          SIWC_TRANSPORT_KEY: ${{ secrets.SIWC_TRANSPORT_KEY }}
        run: node scripts/ci-siwc/prepare.mjs

name: SIWC queue semantics probe
on:
  push:
    branches: ['ci/siwc-queue-probe-*']
permissions:
  contents: read
jobs:
  probe:
    environment: tapilot-siwc-queue-probe
    concurrency:
      group: tapilot-siwc-queue-probe
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read environment generation
        env:
          PROBE_GENERATION: ${{ secrets.PROBE_GENERATION }}
        run: |
          test -n "$PROBE_GENERATION"
          printf '%s' "$PROBE_GENERATION" | sha256sum
      - name: Hold exclusive slot
        run: sleep 45

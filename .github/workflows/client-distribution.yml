name: Verify desktop client setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    name: Setup (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: darwin, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: windows-2025, platform: win32, arch: x64 }
          - { runner: windows-11-arm, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      npm_config_registry: https://registry.npmjs.org
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - name: Verify native runner identity
        run: node -e "const a=require('node:assert/strict'); a.equal(process.platform,process.env.EXPECTED_PLATFORM); a.equal(process.arch,process.env.EXPECTED_ARCH); console.log({platform:process.platform,arch:process.arch,node:process.version});"
      - name: Verify private file permissions before packaging
        run: node scripts/check-private-path.mjs
      - name: Build and independently verify the runtime package
        run: node scripts/check-cli-package.mjs
      - name: Build the offline setup archive
        run: node scripts/build-client-distribution.mjs
      - name: Verify first install, update and restart without installer source
        run: node scripts/check-client-setup.mjs
      - name: Collect downloadable archives
        run: node scripts/collect-client-distribution.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tapilot-client-setup-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/client-downloads/
      - name: Retain verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapilot-client-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            build/setup-validation-*/results.json
            build/setup-validation-*/**/FIRST-INSTALL.txt
            build/setup-validation-*/**/INSTALLATION.md
            build/cli-package-validation/latest.json
            build/client-distribution-*/status.json

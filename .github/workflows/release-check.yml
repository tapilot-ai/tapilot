name: Verify production APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.1'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix plugins/android-use
      - run: npm ci --prefix tests/midscene
      - run: pnpm check
      - name: Build and verify signed release
        env:
          TAPILOT_SIGNING_STORE: ${{ runner.temp }}/tapilot-release.jks
          TAPILOT_SIGNING_STORE_BASE64: ${{ secrets.TAPILOT_SIGNING_STORE_BASE64 }}
          TAPILOT_SIGNING_STORE_PASSWORD: ${{ secrets.TAPILOT_SIGNING_STORE_PASSWORD }}
          TAPILOT_SIGNING_KEY_ALIAS: ${{ secrets.TAPILOT_SIGNING_KEY_ALIAS }}
          TAPILOT_SIGNING_KEY_PASSWORD: ${{ secrets.TAPILOT_SIGNING_KEY_PASSWORD }}
          TAPILOT_SIGNING_CERT_SHA256: ${{ secrets.TAPILOT_SIGNING_CERT_SHA256 }}
        run: |
          trap 'rm -f "$TAPILOT_SIGNING_STORE"' EXIT
          python3 - <<'PYCODE'
          import base64, os
          with open(os.environ['TAPILOT_SIGNING_STORE'], 'wb') as output:
              output.write(base64.b64decode(os.environ['TAPILOT_SIGNING_STORE_BASE64'], validate=True))
          os.chmod(os.environ['TAPILOT_SIGNING_STORE'], 0o600)
          PYCODE
          pnpm build:release
          python3 - <<'PYCODE'
          import hashlib, pathlib, shutil
          output = pathlib.Path('build/release-evidence')
          output.mkdir(parents=True, exist_ok=True)
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          (output / 'SHA256SUMS').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  app-release.apk\n')
          for name in ['LICENSE', 'PRIVACY.md', 'PRIVACY.zh.md', 'CREDITS.md']:
              shutil.copy2(name, output / name)
          shutil.copytree('app/src/main/assets/third-party', output / 'third-party', dirs_exist_ok=True)
          shutil.copytree('app/build/generated/third-party-assets/release/third-party/android', output / 'third-party/android', dirs_exist_ok=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-evidence
          path: build/release-evidence/

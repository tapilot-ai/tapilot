name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix plugins/android-use
      - run: npm ci --prefix tests/midscene
      - run: pnpm check:security
      - run: pnpm check
      - name: Measure model-free conversation overhead
        run: |
          mkdir -p build/performance
          node scripts/benchmark-conversation.mjs > build/performance/conversation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/performance/
      - uses: actions/upload-artifact@v4
        with:
          name: development-beta-apk
          path: app/build/outputs/apk/beta/app-beta.apk

  minimatch: 11.0.1
  follow-redirects: 1.16.2
  'undici@>=6 <7': 6.29.1
  'undici@>=8 <9': 8.12.3
  zod: 4.6.7
  ip-address: 10.7.5
  qs: 6.17.0
